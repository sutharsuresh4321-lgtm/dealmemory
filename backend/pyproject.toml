[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dealmemory"
version = "0.1.0"
description = "DealMemory: A Deal Intelligence Agent with Persistent Memory powered by Hindsight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "hindsight-client>=1.2.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
